name: Build Windows client

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: Optional HTTPS address to prefill in the client
        type: string
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: Set up stable Rust
        run: rustup default stable

      - name: Install shared frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Build the Windows installer
        run: pnpm --dir desktop tauri build --target x86_64-pc-windows-msvc -- --locked
        env:
          VITE_GASOLINE_API_ORIGIN: ${{ inputs.api_origin }}

      - uses: actions/upload-artifact@v7
        with:
          name: gasoline-windows-x64
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
