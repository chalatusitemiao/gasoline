[package]
name = "gasoline-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "system-proxy", "http2", "charset", "cookies", "gzip", "brotli"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "=2.12.5"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util"] }
uuid = "1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
