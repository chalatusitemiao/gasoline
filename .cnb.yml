"v*":
  tag_push:
    - name: 构建 Windows x64 并直传软件中心
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: node:24-trixie
        volumes:
          - windows:/root/.cache/gasoline/pnpm:copy-on-write
      stages:
        - name: 校验 Windows 发布标签
          script: node scripts/build-windows.mjs --check-tag
        - name: 准备 Windows SDK 和构建工具缓存
          type: docker:cache
          timeout: 45m
          options:
            dockerfile: .cnb/windows-toolchain.Dockerfile
            sync: true
          exports:
            name: WINDOWS_TOOLCHAIN_IMAGE
        - name: 准备锁定的 Cargo 依赖缓存
          type: docker:cache
          timeout: 30m
          options:
            dockerfile: .cnb/windows-deps.Dockerfile
            by:
              - desktop/src-tauri/Cargo.toml
              - desktop/src-tauri/Cargo.lock
            buildArgs:
              WINDOWS_TOOLCHAIN_IMAGE: ${WINDOWS_TOOLCHAIN_IMAGE}
            sync: true
          exports:
            name: WINDOWS_BUILD_IMAGE
        - name: 构建 Windows x64 NSIS 安装包
          image: ${WINDOWS_BUILD_IMAGE}
          timeout: 45m
          env:
            CARGO_NET_OFFLINE: "true"
          script: |
            set -eu
            printf 'Windows 工具链缓存镜像：%s\n' "$WINDOWS_TOOLCHAIN_IMAGE"
            printf 'Windows Cargo 依赖缓存镜像：%s\n' "$WINDOWS_BUILD_IMAGE"
            printf 'Windows SDK 缓存：'
            du -sh "$XWIN_CACHE_DIR"
            test -s "$XWIN_CACHE_DIR/xwin/DONE"
            makensis -VERSION
            cargo metadata --locked --offline --format-version 1 --manifest-path desktop/src-tauri/Cargo.toml >/dev/null
            echo 'Cargo 依赖离线检查通过'

            pnpm install --frozen-lockfile --store-dir /root/.cache/gasoline/pnpm
            pnpm --dir desktop install --frozen-lockfile --store-dir /root/.cache/gasoline/pnpm
            node scripts/build-windows.mjs
        - name: 直传软件中心
          imports:
            - https://cnb.cool/ruiange/gasoline-keys/-/blob/main/env.yml
          env:
            APPDOWNLOAD_BASE_URL: https://download.ruiange.work
          lock:
            key: gasoline-windows-publish
            wait: true
          script: node scripts/publish-windows.mjs artifacts/windows/release.json
